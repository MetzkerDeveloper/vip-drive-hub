name: Remove merged branches
on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Delete branches whose PRs were merged into main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'all', per_page: 100 });
            const branches = await github.paginate(github.rest.repos.listBranches, { owner, repo, per_page: 100 });
            const openHeads = new Set(prs.filter(pr => pr.state === 'open' && pr.head.repo?.full_name === context.repo.owner + '/' + context.repo.repo).map(pr => pr.head.ref));
            const merged = prs.filter(pr => pr.merged_at && pr.base.ref === 'main' && pr.head.repo?.full_name === owner + '/' + repo);
            for (const branch of branches) {
              if (branch.name === 'main' || branch.protected || openHeads.has(branch.name)) continue;
              const matching = merged.filter(pr => pr.head.ref === branch.name && pr.head.sha === branch.commit.sha);
              if (matching.length === 0) continue;
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + branch.name });
                core.info('Deleted merged branch: ' + branch.name);
              } catch (error) {
                core.warning('Could not delete ' + branch.name + ': ' + error.message);
              }
            }
